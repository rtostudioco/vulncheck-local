# Sentinel Desk 1.0 — continuous integration
#
# Runs on every push and PR to main:
#   1. Lint (ESLint, Next.js rules)
#   2. Strict type check (tsc --noEmit)
#
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bunx tsc --noEmit
