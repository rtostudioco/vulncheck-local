name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Type check & build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:../db/custom.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Create SQLite database & generate Prisma client
        run: npx prisma db push

      - name: Type check
        run: npx tsc --noEmit

      - name: Build (standalone output)
        run: npm run build
