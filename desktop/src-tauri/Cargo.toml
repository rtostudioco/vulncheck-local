# SENTINEL DESK 1.0 — Desktop shell (Tauri 2 + Rust)
# Local Intelligence. Human-Controlled Defense.
#
# READ-ONLY collector: this binary never writes to the Windows Event Log,
# never changes audit policy and never elevates. See src/collectors/windows_event_log.rs.

[package]
name = "sentinel-desk"
version = "1.0.0"
description = "Sentinel Desk — local-first SOC investigation assistant (NOT an antivirus/EDR/SIEM)"
authors = ["Sentinel Desk Core Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77"

[lib]
name = "sentinel_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "sentinel-desk"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
# fancy-regex wraps `regex` and adds lookarounds/backreferences, required by
# rule SD-008's verbatim negative-lookahead IP pattern (kept identical to the
# web prototype catalog). Plain `regex` remains a dependency for simple uses.
fancy-regex = "0.13"
sha2 = "0.10"
rand = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_EventLog",
  "Win32_System_Time",
  "Win32_System_SystemInformation",
] }

[features]
default = []
# Labeled synthetic demo collector (development on non-Windows machines and
# deterministic rule-test fixtures). NEVER enabled in release bundles.
demo-fixtures = []

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "s"
